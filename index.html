  <body>
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>

    <script>
      const theme = localStorage.getItem('theme');

      if (!theme) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else if (theme === 'light') {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </body>
